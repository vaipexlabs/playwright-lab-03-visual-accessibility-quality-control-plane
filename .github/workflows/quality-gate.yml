name: Experience quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked toolchain
        run: ./scripts/setup.sh

      - name: Run static and unit checks
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/pytest -q tests/unit

      - name: Run combined experience quality gate
        run: ./scripts/test-quality.sh

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-quality-evidence
          path: |
            artifacts/visual/actual/
            artifacts/visual/diffs/
            reports/
          if-no-files-found: warn
          retention-days: 14
