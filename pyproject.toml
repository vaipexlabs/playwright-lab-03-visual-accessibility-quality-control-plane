[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaipex-visual-accessibility-quality-control-plane"
version = "0.1.0"
description = "A governed visual regression and accessibility quality system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Vaipex Labs", email = "vaipex.labs@gmail.com" }]
dependencies = [
    "axe-playwright-python==0.1.8",
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "pillow==12.3.0",
    "playwright==1.62.0",
    "uvicorn==0.52.3",
]

[project.optional-dependencies]
test = [
    "httpx2==2.10.0",
    "pip-tools==7.6.1",
    "pytest==9.1.1",
    "pytest-html==4.2.0",
    "pytest-playwright==0.9.0",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "visual: deterministic screenshot comparisons",
    "accessibility: automated accessibility policy checks",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vaipex_visual_accessibility = ["static/*", "templates/*.html"]
